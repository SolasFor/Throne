name: Windows build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.3.0 (empty = 0.0.0-dev.<run number>)"
        required: false
        default: ""
      publish:
        description: "Publish a GitHub release v<version> (needs a version)"
        type: boolean
        default: false
  push:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Version
        id: version
        shell: pwsh
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          $v = "$env:VERSION_INPUT".Trim().TrimStart('v')
          if (-not $v) { $v = "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: core/go.sum

      - name: Cache downloads
        uses: actions/cache@v6.1.0
        with:
          path: build-tools/downloads
          key: win-downloads-qt6.12.0-protoc36.2-x64

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build
        shell: pwsh
        run: ./packaging/build.ps1 -Version "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Throne-${{ steps.version.outputs.version }}-windows64
          path: |
            deployment/*.zip
            deployment/*.exe
            build/ninja.log
          if-no-files-found: ignore

      - name: Release
        if: github.event.inputs.publish == 'true' && github.event.inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Throne ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            deployment/*.zip
            deployment/*.exe
